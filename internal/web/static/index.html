<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orebelt — 皮带振动尖峰台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <h1>orebelt 皮带振动尖峰台</h1>
    <p class="subtitle">露天矿皮带机加速度采样 · 尖峰聚合 · 节流上报</p>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>最近尖峰</h2>
      <div id="spike-table" class="table-wrap">加载中…</div>
    </section>

    <section class="panel">
      <h2>皮带缓冲状态</h2>
      <div id="belt-stats" class="cards">加载中…</div>
    </section>

    <section class="panel">
      <h2>模拟采样</h2>
      <form id="sample-form">
        <label>
          皮带 ID
          <input name="belt_id" value="3" required>
        </label>
        <label>
          加速度 (g)
          <input name="accel" type="number" step="0.01" value="3.0" required>
        </label>
        <button type="submit">推送样本</button>
      </form>
      <pre id="sample-result"></pre>
    </section>
  </main>

  <footer class="footer">
    <span>orebelt v1 · POST /v1/samples · GET /v1/belts/{id}/spikes</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
